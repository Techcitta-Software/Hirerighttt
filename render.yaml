# Render Blueprint for the API (Python / FastAPI). The website is the Vercel project (vercel.json).
# New -> Blueprint -> pick this repo: Render creates the service below from this file.
# Render asks for every `sync: false` value when the Blueprint is created. Never put secrets in this file.
# After the first deploy, point the /api rewrite in vercel.json at this service's onrender.com URL.
services:
  - type: web
    name: hirerighttt-api
    runtime: python
    plan: free
    region: singapore
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers --forwarded-allow-ips=*
    healthCheckPath: /api/health/live
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.1"
      - key: ENVIRONMENT
        value: production
      - key: WEB_CONCURRENCY
        value: "1"
      - key: DB_POOL_MIN
        value: "1"
      - key: DB_POOL_MAX
        value: "5"
      - key: SIGNUP_ENABLED
        value: "true"
      - key: ALLOW_DEMO_ACCOUNTS
        value: "false"
      # Must be the S3 bucket's own region (hirerighttt-tests is in us-east-1), or presigned resume links fail.
      - key: AWS_REGION
        value: us-east-1
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: TRUST_PROXY
        value: "true"
      - key: CORS_ORIGINS
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Extra Gemini keys (ideally from different Google Cloud projects) so a 503 "high demand" or 429 on one key
      # does not stop interviews. Leave blank if you have only one.
      - key: GEMINI_API_KEY_2
        sync: false
      - key: GEMINI_API_KEY_3
        sync: false
      # Guards /api/internal/* (reminders, maintenance) and unlocks the detailed /api/health report.
      - key: CRON_SECRET
        generateValue: true
      - key: S3_BUCKET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: SMTP_EMAIL
        sync: false
      - key: SMTP_APP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Email will move to Resend later (no SES). Leave blank to keep SMTP.
      - key: RESEND_API_KEY
        sync: false
