# HireRight Node API — Render Blueprint (repo: backend/node)
# Apply: Render Dashboard → New → Blueprint → branch main
# Set every `sync: false` key from repo-root `.env` (never commit secrets here).
# Do NOT add VITE_* vars here — those belong on Vercel only.

services:
  - type: web
    name: hireright-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend/node
    # Render sets PORT automatically — do not override. CI=true skips Chromium unless forced below.
    buildCommand: PLAYWRIGHT_INSTALL_CHROMIUM=1 npm install
    startCommand: node index.mjs
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # ─── Build / runtime ───
      - key: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD
        value: "1"
      # Server PDFs need Chromium; on free tier keep disabled or set PLAYWRIGHT_INSTALL_CHROMIUM=1 on paid + remove skip.
      - key: SCORECARD_PDF_DISABLED
        value: "1"
      - key: NODE_ENV
        value: production
      - key: ENVIRONMENT
        value: production
      - key: TRUST_PROXY
        value: "true"

      # ─── Auth & API ───
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        # Replace with your exact Vercel production URL (and preview URLs if needed)
        value: "https://hire-rightt.vercel.app,http://localhost:5173"
      - key: ALLOW_DEMO_ACCOUNTS
        value: "false"
      - key: SIGNUP_ENABLED
        value: "true"
      - key: PUBLIC_APP_URL
        value: https://hire-rightt.vercel.app
      - key: INVITE_JOIN_WINDOW_MINUTES
        value: "5"
      - key: MAX_REQUEST_BYTES
        value: "3000000"
      # Optional: set true to hard-fail boot on missing GEMINI / SESSION / CORS
      - key: STRICT_PRODUCTION_CONFIG
        value: "false"

      # ─── Storage: Neon + S3 (matches local DISABLE_SUPABASE=true) ───
      - key: DISABLE_SUPABASE
        value: "true"
      - key: AWS_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_SESSION_TOKEN
        sync: false
      # Optional safety pin — must match S3_BUCKET if set
      - key: S3_EXPECTED_BUCKET
        sync: false
      - key: S3_DEFAULT_TENANT_ID
        value: platform
      - key: S3_PRESIGN_EXPIRES_SECONDS
        value: "900"
      - key: S3_MAX_RECORDING_BYTES
        value: "104857600"
      - key: S3_MAX_REPORT_BYTES
        value: "12000000"
      # Neon backup script (optional; not required for web service boot)
      - key: S3_BACKUP_BUCKET
        sync: false
      - key: S3_BACKUP_PREFIX
        value: neon/hireright/

      # ─── AI (server-side interview / resume) ───
      - key: GEMINI_API_KEY
        sync: false
      - key: PRIMARY_MODEL
        value: gemini-3.5-flash-lite
      - key: FAST_MODEL
        value: gemini-3.5-flash-lite
      - key: FALLBACK_MODEL
        value: gemini-3.5-flash-lite
      - key: OPENAI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false

      # ─── Groq Whisper (server STT — never expose to Vite) ───
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_WHISPER_MODEL
        value: whisper-large-v3-turbo
      - key: GROQ_WHISPER_LANGUAGE
        value: en

      # ─── Email (Gmail App Password — same as mailer.mjs / local .env) ───
      - key: SMTP_EMAIL
        sync: false
      - key: SMTP_APP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false

      # ─── Optional ops / labeling ───
      - key: API_BUILD_ID
        value: hireright-neon-2026-10-16
      - key: DNS_SERVERS
        sync: false
