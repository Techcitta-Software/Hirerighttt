# HireRight Python API — Render Blueprint
# Service root: backend (FastAPI)

services:
  - type: web
    name: hireright-backend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENVIRONMENT
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: ALLOW_DEMO_ACCOUNTS
        value: "false"
      - key: SIGNUP_ENABLED
        value: "true"
      - key: MAX_REQUEST_BYTES
        value: "3000000"
      - key: STRICT_PRODUCTION_CONFIG
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: "https://hire-rightt.vercel.app,http://localhost:5173,http://127.0.0.1:5173"
      - key: PUBLIC_APP_URL
        value: https://hire-rightt.vercel.app
      - key: INVITE_JOIN_WINDOW_MINUTES
        value: "5"
      - key: DISABLE_SUPABASE
        value: "true"
      - key: AWS_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_SESSION_TOKEN
        sync: false
      - key: S3_EXPECTED_BUCKET
        sync: false
      - key: S3_DEFAULT_TENANT_ID
        value: platform
      - key: S3_PRESIGN_EXPIRES_SECONDS
        value: "900"
      - key: S3_MAX_RECORDING_BYTES
        value: "104857600"
      - key: S3_MAX_REPORT_BYTES
        value: "12000000"
      - key: GEMINI_API_KEY
        sync: false
      - key: PRIMARY_MODEL
        value: gemini-3.1-flash-lite
      - key: FAST_MODEL
        value: gemini-3.1-flash-lite
      - key: FALLBACK_MODEL
        value: gemini-3.1-flash-lite
      - key: OPENAI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SMTP_EMAIL
        sync: false
      - key: SMTP_APP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: API_BUILD_ID
        value: hireright-python-2026-10-29
