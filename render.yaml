services:
  # -------------------------------------------------------------
  # HIRE RIGHT - BACKEND NODE.JS API WEB SERVICE ON RENDER
  # -------------------------------------------------------------
  # Dashboard service ID (link existing service): exs-db6tb9ou01pc73bhfe3g
  - type: web
    name: hireright-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend/node
    # Render sets PORT automatically — do not override. CI=true skips Chromium unless forced below.
    buildCommand: PLAYWRIGHT_INSTALL_CHROMIUM=1 npm install
    startCommand: node index.mjs
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENVIRONMENT
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: DISABLE_SUPABASE
        value: "true"
      - key: CORS_ORIGINS
        # Replace with your exact Vercel production URL (and preview URLs if needed)
        value: "https://hire-rightt.vercel.app,http://localhost:5173"
      - key: ALLOW_DEMO_ACCOUNTS
        value: "false"
      - key: SIGNUP_ENABLED
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: AWS_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: PUBLIC_APP_URL
        value: https://hire-rightt.vercel.app
      - key: GROQ_API_KEY
        sync: false
      - key: INVITE_JOIN_WINDOW_MINUTES
        value: "5"
      - key: SMTP_HOST
        value: smtp.sendgrid.net
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        value: apikey
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
