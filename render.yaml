services:
  # -------------------------------------------------------------
  # HIRE RIGHT - BACKEND NODE.JS API WEB SERVICE ON RENDER
  # -------------------------------------------------------------
  - type: web
    name: hireright-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend/node
    buildCommand: npm install && node -e "console.log('render build ok')"
    startCommand: node index.mjs
    # Skip ~300MB Playwright Chromium on Render build (free tier timeouts). PDF upload needs PLAYWRIGHT_INSTALL_CHROMIUM=1 on paid plans or generate PDFs elsewhere.
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD
        value: "1"
      - key: NODE_ENV
        value: production
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: 8787
      - key: CORS_ORIGINS
        value: "https://hire-rightt.vercel.app,http://localhost:5173"
      - key: ALLOW_DEMO_ACCOUNTS
        value: "false"
      - key: SIGNUP_ENABLED
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: PUBLIC_APP_URL
        value: https://hire-rightt.vercel.app
      - key: INVITE_JOIN_WINDOW_MINUTES
        value: "5"
      - key: SMTP_HOST
        value: smtp.sendgrid.net
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        value: apikey
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
