services:
  # -------------------------------------------------------------
  # HIRE RIGHT - BACKEND NODE.JS API WEB SERVICE ON RENDER
  # -------------------------------------------------------------
  # Dashboard service ID (link existing service): exs-db6tb9ou01pc73bhfe3g
  - type: web
    name: hireright-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend/node
    buildCommand: npm install && node -e "console.log('render build ok')"
    startCommand: node index.mjs
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: 8787
      - key: CORS_ORIGINS
        value: "https://hire-rightt.vercel.app,http://localhost:5173"
      - key: ALLOW_DEMO_ACCOUNTS
        value: "true"
      - key: SIGNUP_ENABLED
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
