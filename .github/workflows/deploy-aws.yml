name: Deploy to AWS

# FULL (paid) AWS setup: dev1 -> staging, main -> production (production waits for approval if the "production"
# GitHub environment has required reviewers). Tests must pass first. Off unless the repository variables
# AWS_DEPLOY_ROLE_ARN and AWS_FULL_DEPLOY=true are both set, so it can never start (and bill) by accident.
# The free-tier test environment has its own workflow: deploy-aws-test.yml.
on:
  push:
    branches: [dev1, main]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        options: [staging, production]
        default: staging

concurrency:
  group: deploy-aws-${{ github.ref_name }}-${{ inputs.environment || 'auto' }}
  cancel-in-progress: false # never interrupt a deploy half-way

jobs:
  test:
    if: vars.AWS_DEPLOY_ROLE_ARN != '' && vars.AWS_FULL_DEPLOY == 'true'
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    if: vars.AWS_DEPLOY_ROLE_ARN != '' && vars.AWS_FULL_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: ${{ inputs.environment || (github.ref_name == 'main' && 'production') || 'staging' }}
    permissions:
      id-token: write # GitHub OIDC -> short-lived AWS credentials (no stored keys)
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1
          role-duration-seconds: 3600

      - name: Deploy
        run: bash infra/aws/deploy.sh "${{ inputs.environment || (github.ref_name == 'main' && 'production') || 'staging' }}" "${{ github.sha }}"
