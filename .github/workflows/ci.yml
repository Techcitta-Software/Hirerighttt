name: CI

on:
  push:
    branches: [main, master, dev, develop, dev1]
  pull_request:
  workflow_call: # the AWS deploy runs these same checks first

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hr_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: npm ci

      - name: Secret scan (tracked files)
        run: node scripts/secret-scan.mjs

      - run: pip install -r requirements-dev.txt
        working-directory: backend

      # Real Postgres so migrations, audit and retention tests run instead of being skipped.
      - run: python -m pytest -q
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hr_test?sslmode=disable

      - run: npm run lint

      - name: Build frontend
        env:
          VITE_AUTH_PROVIDER: api
          # Production bundles must never ship client-side LLM keys (vulnerability-scan-agent).
        run: npm run build

      - name: Assert prod bundle has no obvious API key material
        run: |
          if command -v rg >/dev/null 2>&1; then
            ! rg -q 'AIza[0-9A-Za-z_-]{20,}' frontend/dist || (echo "Possible API key in frontend/dist" && exit 1)
          fi

      - name: Production config smoke (Python API)
        env:
          ENVIRONMENT: production
          DATABASE_URL: postgresql://u:p@localhost:5432/db?sslmode=require
          SESSION_SECRET: ci-smoke-test-secret-at-least-32-chars-long
          CORS_ORIGINS: https://app.example.com
          GEMINI_API_KEY: ci-key-placeholder
        run: python -c "from app.node_config import assert_production_config; assert_production_config()"
        working-directory: backend
