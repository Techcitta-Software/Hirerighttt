name: CI

on:
  push:
    branches: [main, master, dev, develop]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: npm ci

      - run: pip install -r requirements.txt
        working-directory: backend

      - run: python -m pytest -q
        working-directory: backend

      - run: npm run lint

      - name: Build frontend
        env:
          VITE_AUTH_PROVIDER: api
        run: npm run build

      - name: Production config smoke (Python API)
        env:
          ENVIRONMENT: production
          DATABASE_URL: postgresql://u:p@localhost:5432/db?sslmode=require
          SESSION_SECRET: ci-smoke-test-secret-at-least-32-chars-long
          CORS_ORIGINS: https://app.example.com
          GEMINI_API_KEY: ci-key-placeholder
        run: python -c "from app.node_config import assert_production_config; assert_production_config()"
        working-directory: backend
