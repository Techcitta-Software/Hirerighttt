name: Deploy Frontend to Vercel

# Production: push to main (paths below) runs build + optional Vercel deploy.
# To enable deploy, add repository secrets (Settings → Secrets → Actions):
#   VERCEL_TOKEN, VERCEL_PROJECT_ID (required)
#   VERCEL_ORG_ID (optional — auto-filled for personal accounts)
# VERCEL_TOKEN: https://vercel.com/account/tokens
# VERCEL_ORG_ID / VERCEL_PROJECT_ID: Vercel project Settings, or .vercel/project.json after `vercel link`

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'vercel.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-vercel.yml'
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  build:
    name: Verify production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Lint Code
        run: npm run lint

      - name: Build Frontend
        env:
          VITE_API_URL: ''
          VITE_AUTH_PROVIDER: api
        run: npm run build

  deploy:
    name: Deploy to Vercel (production)
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Check Vercel secrets
        id: vercel_secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Set VERCEL_TOKEN and VERCEL_PROJECT_ID in GitHub Actions secrets."
            exit 0
          fi

          ORG_ID="$VERCEL_ORG_ID"
          if [ -z "$ORG_ID" ]; then
            echo "VERCEL_ORG_ID not set — resolving owner id from Vercel API (personal accounts)."
            ORG_ID=$(curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}" \
              | node -e "let b='';process.stdin.on('data',c=>b+=c);process.stdin.on('end',()=>{try{const j=JSON.parse(b);process.stdout.write(String(j.accountId||j.teamId||''));}catch{process.stdout.write('');}})")
          fi

          if [ -z "$ORG_ID" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Could not resolve VERCEL_ORG_ID. Add it manually (Vercel project Settings → General, owner/account id)."
            exit 0
          fi

          echo "VERCEL_ORG_ID=$ORG_ID" >> "$GITHUB_ENV"
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "Using Vercel org/account id: $ORG_ID"

      - name: Install Vercel CLI
        if: steps.vercel_secrets.outputs.ready == 'true'
        run: npm install --global vercel@41

      - name: Pull Vercel Environment Information
        if: steps.vercel_secrets.outputs.ready == 'true'
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        if: steps.vercel_secrets.outputs.ready == 'true'
        env:
          VITE_API_URL: ''
          VITE_AUTH_PROVIDER: api
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        if: steps.vercel_secrets.outputs.ready == 'true'
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "Production URL: $url"
