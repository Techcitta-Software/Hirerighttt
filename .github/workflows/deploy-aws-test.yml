name: Deploy to AWS test (free tier)

# AWS is not the current release path. Vercel (vercel.json) and Render (render.yaml) are.
# This workflow stays available as a manual run only.
on:
  workflow_dispatch:

concurrency:
  group: deploy-aws-test
  cancel-in-progress: false # never interrupt a release half-way

jobs:
  # A push with the variables unset used to finish green and skipped. This job says why no release happened.
  ready:
    if: vars.AWS_DEPLOY_ROLE_ARN == '' || vars.AWS_TEST_DEPLOY != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy is not turned on
        run: |
          echo "This repository has not turned on the AWS test deploy."
          echo "Settings -> Secrets and variables -> Actions -> Variables:"
          echo "  AWS_DEPLOY_ROLE_ARN = the hireright-github-deploy role ARN"
          echo "  AWS_TEST_DEPLOY = true"
          echo "Settings -> Environments -> create an environment named test."
          exit 1

  test:
    if: vars.AWS_DEPLOY_ROLE_ARN != '' && vars.AWS_TEST_DEPLOY == 'true'
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    if: vars.AWS_DEPLOY_ROLE_ARN != '' && vars.AWS_TEST_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: test
    permissions:
      id-token: write # GitHub OIDC -> short-lived AWS credentials (no stored keys)
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Release
        run: bash infra/aws-free/deploy.sh "${{ github.sha }}"
