name: Data maintenance

# Daily clean-up: expired sessions and reset tokens, audit rows past AUDIT_RETENTION_DAYS, and (when
# RECORDING_RETENTION_DAYS is set on the API) old interview recordings and reports.
# Uses the same API_BASE_URL / CRON_SECRET secrets as the reminders workflow.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run retention sweep
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$API_BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "API_BASE_URL / CRON_SECRET not set; skipping."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 300 --retry 2 --retry-delay 20 \
            -X POST "$API_BASE_URL/api/internal/maintenance" \
            -H "X-Cron-Secret: $CRON_SECRET"
