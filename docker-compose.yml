services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hireright
      POSTGRES_USER: hireright
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "5432:5432"
    volumes:
      - hireright-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hireright -d hireright"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql://hireright:local-development-only@postgres:5432/hireright
      SESSION_SECRET: local-compose-secret-change-before-deploying-32chars
      CORS_ORIGINS: http://localhost:5173
      TRUSTED_HOSTS: localhost,127.0.0.1,api
    ports:
      - "8787:8787"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  hireright-postgres:
