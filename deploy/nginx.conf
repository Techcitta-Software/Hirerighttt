# Static frontend + reverse proxy to the API container (docker-compose.prod.yml).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Interview recordings are uploaded in chunks / presigned to S3, but résumé and report bodies can be large.
  client_max_body_size 20m;

  location /api/ {
    proxy_pass http://api:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;   # AI scoring and text-to-speech can take a while
    proxy_buffering off;       # stream the interviewer's voice as it is generated
  }

  # Hashed build assets never change: cache them hard. The HTML shell must always be revalidated.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;   # client-side routes (React Router) fall back to the app shell
  }
}
