# Production: Python API + static frontend. Postgres via Neon (DATABASE_URL in repo-root .env).
#
#   cp .env.production.example .env   # fill secrets
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Optional local Postgres instead of Neon:
#   docker compose -f docker-compose.prod.yml --profile self-hosted-db up -d --build

services:
  postgres:
    profiles: ["self-hosted-db"]
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hireright}
      POSTGRES_USER: ${POSTGRES_USER:-hireright}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - hireright-postgres-prod:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-hireright} -d ${POSTGRES_DB:-hireright}']
      interval: 10s
      timeout: 5s
      retries: 8
    restart: unless-stopped

  api:
    build:
      context: backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
      NODE_ENV: production
      PORT: 8787
      TRUST_PROXY: "true"
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-hireright}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hireright}}
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ${PUBLIC_API_URL:-}
    ports:
      - '${WEB_PORT:-8080}:80'
    depends_on:
      - api
    restart: unless-stopped

volumes:
  hireright-postgres-prod:
