AWSTemplateFormatVersion: "2010-09-09"
Description: HireRight DynamoDB (2 tables) — deploy alongside Neon; does not modify Postgres.

Parameters:
  TablePrefix:
    Type: String
    Default: hireright
  EnvironmentName:
    Type: String
    AllowedValues: [dev, staging, prod]
    Default: prod
  BillingMode:
    Type: String
    Default: PAY_PER_REQUEST
    AllowedValues: [PAY_PER_REQUEST, PROVISIONED]
  DeletionProtection:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]

Conditions:
  IsProvisioned: !Equals [!Ref BillingMode, PROVISIONED]

Resources:
  MainTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${TablePrefix}-${EnvironmentName}-main"
      BillingMode: !Ref BillingMode
      DeletionProtectionEnabled: !Equals [!Ref DeletionProtection, "true"]
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: AES256
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
        - { AttributeName: gsi1pk, AttributeType: S }
        - { AttributeName: gsi1sk, AttributeType: S }
        - { AttributeName: gsi2pk, AttributeType: S }
        - { AttributeName: gsi2sk, AttributeType: S }
        - { AttributeName: gsi3pk, AttributeType: S }
        - { AttributeName: gsi3sk, AttributeType: S }
        - { AttributeName: gsi4pk, AttributeType: S }
        - { AttributeName: gsi4sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: Gsi1
          KeySchema:
            - { AttributeName: gsi1pk, KeyType: HASH }
            - { AttributeName: gsi1sk, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
          ProvisionedThroughput: !If
            - IsProvisioned
            - { ReadCapacityUnits: 5, WriteCapacityUnits: 5 }
            - !Ref AWS::NoValue
        - IndexName: Gsi2
          KeySchema:
            - { AttributeName: gsi2pk, KeyType: HASH }
            - { AttributeName: gsi2sk, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
          ProvisionedThroughput: !If
            - IsProvisioned
            - { ReadCapacityUnits: 5, WriteCapacityUnits: 5 }
            - !Ref AWS::NoValue
        - IndexName: Gsi3
          KeySchema:
            - { AttributeName: gsi3pk, KeyType: HASH }
            - { AttributeName: gsi3sk, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
          ProvisionedThroughput: !If
            - IsProvisioned
            - { ReadCapacityUnits: 5, WriteCapacityUnits: 5 }
            - !Ref AWS::NoValue
        - IndexName: Gsi4
          KeySchema:
            - { AttributeName: gsi4pk, KeyType: HASH }
            - { AttributeName: gsi4sk, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
          ProvisionedThroughput: !If
            - IsProvisioned
            - { ReadCapacityUnits: 5, WriteCapacityUnits: 5 }
            - !Ref AWS::NoValue
      ProvisionedThroughput: !If
        - IsProvisioned
        - { ReadCapacityUnits: 10, WriteCapacityUnits: 10 }
        - !Ref AWS::NoValue
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - { Key: application, Value: hireright }
        - { Key: env, Value: !Ref EnvironmentName }

  AuditTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${TablePrefix}-${EnvironmentName}-audit"
      BillingMode: !Ref BillingMode
      DeletionProtectionEnabled: !Equals [!Ref DeletionProtection, "true"]
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: AES256
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
        - { AttributeName: gsi1pk, AttributeType: S }
        - { AttributeName: gsi1sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: Gsi1
          KeySchema:
            - { AttributeName: gsi1pk, KeyType: HASH }
            - { AttributeName: gsi1sk, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
          ProvisionedThroughput: !If
            - IsProvisioned
            - { ReadCapacityUnits: 5, WriteCapacityUnits: 5 }
            - !Ref AWS::NoValue
      ProvisionedThroughput: !If
        - IsProvisioned
        - { ReadCapacityUnits: 5, WriteCapacityUnits: 5 }
        - !Ref AWS::NoValue
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - { Key: application, Value: hireright }
        - { Key: env, Value: !Ref EnvironmentName }

Outputs:
  MainTableName:
    Value: !Ref MainTable
  AuditTableName:
    Value: !Ref AuditTable