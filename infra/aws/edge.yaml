AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  HireRight edge (deploy in us-east-1: CloudFront only accepts certificates and WAF rules from there).
  The site's HTTPS certificate and the web application firewall in front of it.

Parameters:
  EnvironmentName:
    Type: String
    AllowedValues: [staging, production]
  DomainName:
    Type: String
    Description: Site hostname, e.g. app.example.com or staging.example.com
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: Route 53 hosted zone that serves the domain (used to prove ownership for the certificate)

Resources:
  SiteCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId
      Tags: [{ Key: Name, Value: !Sub "hireright-${EnvironmentName}" }]

  WebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub "hireright-${EnvironmentName}"
      Scope: CLOUDFRONT
      DefaultAction: { Allow: {} }
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub "hireright-${EnvironmentName}"
      Rules:
        # Brute force on sign-in / sign-up / password reset (the API has its own per-account limits too).
        - Name: auth-rate-limit
          Priority: 0
          Action: { Block: {} }
          Statement:
            RateBasedStatement:
              Limit: 100
              EvaluationWindowSec: 300
              AggregateKeyType: IP
              ScopeDownStatement:
                RegexMatchStatement:
                  RegexString: "^/api/(login|signup|password/)"
                  FieldToMatch: { UriPath: {} }
                  TextTransformations: [{ Priority: 0, Type: LOWERCASE }]
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: auth-rate-limit
        # Generous on purpose: a college lab shares one public IP across many candidates.
        - Name: global-rate-limit
          Priority: 1
          Action: { Block: {} }
          Statement:
            RateBasedStatement:
              Limit: 6000
              EvaluationWindowSec: 300
              AggregateKeyType: IP
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: global-rate-limit
        - Name: aws-ip-reputation
          Priority: 2
          OverrideAction: { None: {} }
          Statement:
            ManagedRuleGroupStatement: { VendorName: AWS, Name: AWSManagedRulesAmazonIpReputationList }
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: aws-ip-reputation
        - Name: aws-known-bad-inputs
          Priority: 3
          OverrideAction: { None: {} }
          Statement:
            ManagedRuleGroupStatement: { VendorName: AWS, Name: AWSManagedRulesKnownBadInputsRuleSet }
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: aws-known-bad-inputs
        # Body rules only COUNT: resumes are large and interview answers legitimately contain code
        # ("<script>", "../", SQL), which these rules would otherwise block.
        - Name: aws-common
          Priority: 4
          OverrideAction: { None: {} }
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
              RuleActionOverrides:
                - { Name: SizeRestrictions_BODY, ActionToUse: { Count: {} } }
                - { Name: CrossSiteScripting_BODY, ActionToUse: { Count: {} } }
                - { Name: GenericLFI_BODY, ActionToUse: { Count: {} } }
                - { Name: GenericRFI_BODY, ActionToUse: { Count: {} } }
                - { Name: EC2MetaDataSSRF_BODY, ActionToUse: { Count: {} } }
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: aws-common

Outputs:
  CertificateArn:
    Value: !Ref SiteCertificate
  WebAclArn:
    Value: !GetAtt WebAcl.Arn
