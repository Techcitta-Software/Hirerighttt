AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Lets GitHub Actions deploy HireRight with short-lived credentials (OpenID Connect). No AWS access keys are stored
  in GitHub. Deploy once per AWS account.

Parameters:
  GitHubRepo:
    Type: String
    Description: owner/name of the ONE repository that deploys (e.g. bharath-techcitta/HireRighttt-backend)
  CreateOidcProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: false if this account already has the token.actions.githubusercontent.com identity provider

Conditions:
  CreateProvider: !Equals [!Ref CreateOidcProvider, "true"]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: hireright-github-deploy
      MaxSessionDuration: 7200
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                # only jobs that run in this repository's "test" / "staging" / "production" GitHub environments
                token.actions.githubusercontent.com:sub:
                  - !Sub "repo:${GitHubRepo}:environment:test"
                  - !Sub "repo:${GitHubRepo}:environment:staging"
                  - !Sub "repo:${GitHubRepo}:environment:production"
      # Least privilege for the free-tier stack (infra/aws-free): only the services it creates and the CLI calls
      # deploy.sh / remote-deploy.sh make. No managed admin/power-user policy.
      Policies:
        - PolicyName: hireright-free-tier-deploy
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action:
                  - cloudformation:*
                  - ec2:Describe*
                  - ec2:CreateDefaultVpc
                  - ec2:RunInstances
                  - ec2:TerminateInstances
                  - ec2:StartInstances
                  - ec2:StopInstances
                  - ec2:ModifyInstanceAttribute
                  - ec2:CreateTags
                  - ec2:DeleteTags
                  - ec2:CreateSecurityGroup
                  - ec2:DeleteSecurityGroup
                  - ec2:AuthorizeSecurityGroupIngress
                  - ec2:AuthorizeSecurityGroupEgress
                  - ec2:RevokeSecurityGroupIngress
                  - ec2:RevokeSecurityGroupEgress
                  - ec2:AllocateAddress
                  - ec2:ReleaseAddress
                  - ec2:AssociateAddress
                  - ec2:DisassociateAddress
                  - ec2:AssociateIamInstanceProfile
                  - ec2:DisassociateIamInstanceProfile
                  - ec2:GetManagedPrefixListEntries
                  - rds:*
                  - cloudfront:*
                  - budgets:*
                  - iam:CreateInstanceProfile
                  - iam:DeleteInstanceProfile
                  - iam:GetInstanceProfile
                  - iam:AddRoleToInstanceProfile
                  - iam:RemoveRoleFromInstanceProfile
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:GetParametersByPath
                  - ssm:PutParameter
                  - ssm:DeleteParameter
                  - ssm:SendCommand
                  - ssm:GetCommandInvocation
                  - ssm:ListCommandInvocations
                Resource: "*"
              - Effect: Allow
                Action: s3:*
                Resource:
                  - arn:aws:s3:::hireright*
                  - arn:aws:s3:::hireright*/*
        - PolicyName: hireright-roles-only
        - PolicyName: hireright-roles-only
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:PassRole
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:UpdateRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:PutRolePolicy
                  - iam:GetRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/hireright-*"
              - Effect: Allow
                Action: iam:CreateServiceLinkedRole
                Resource: "*"

Outputs:
  DeployRoleArn:
    Description: Put this in the GitHub repository variable AWS_DEPLOY_ROLE_ARN
    Value: !GetAtt DeployRole.Arn
